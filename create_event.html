{% extends "base.html" %}
{% block title %}Create Event{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-4"><i class="bi bi-plus-circle"></i> Create New Event</h2>

                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Event Title *</label>
                            <input type="text" name="title" class="form-control" required maxlength="200"
                                   placeholder="e.g. AI & Robotics Workshop">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description *</label>
                            <textarea name="description" class="form-control" rows="5" required
                                      placeholder="Describe the event, what attendees will learn or experience..."></textarea>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Category *</label>
                                <select name="category" class="form-select" required>
                                    {% for cat in categories %}
                                    <option value="{{ cat }}">{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Capacity *</label>
                                <input type="number" name="capacity" class="form-control" value="50" min="1" max="5000" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Location *</label>
                            <input type="text" name="location" class="form-control" required
                                   placeholder="e.g. Engineering Building - Lab 204">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Start Date & Time *</label>
                                <input type="datetime-local" name="start_time" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">End Date & Time *</label>
                                <input type="datetime-local" name="end_time" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Event Image (optional)</label>
                            <input type="file" name="image_file" class="form-control mb-2"
                                   accept=".png,.jpg,.jpeg,.gif,.webp">
                            <label class="form-label small text-muted">Or use an image URL</label>
                            <input type="url" name="image_url" class="form-control"
                                   placeholder="https://example.com/image.jpg">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg"></i> Create Event
                            </button>
                            <a href="{{ url_for('events') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
