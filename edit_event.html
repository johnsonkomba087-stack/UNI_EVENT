{% extends "base.html" %}
{% block title %}Edit Event{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-4"><i class="bi bi-pencil"></i> Edit Event</h2>

                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Event Title *</label>
                            <input type="text" name="title" class="form-control" required value="{{ event.title }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description *</label>
                            <textarea name="description" class="form-control" rows="5" required>{{ event.description }}</textarea>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Category *</label>
                                <select name="category" class="form-select" required>
                                    {% for cat in categories %}
                                    <option value="{{ cat }}" {% if event.category == cat %}selected{% endif %}>{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Capacity *</label>
                                <input type="number" name="capacity" class="form-control" value="{{ event.capacity }}" min="1" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Status</label>
                                <select name="status" class="form-select">
                                    <option value="upcoming" {% if event.status == 'upcoming' %}selected{% endif %}>Upcoming</option>
                                    <option value="ongoing" {% if event.status == 'ongoing' %}selected{% endif %}>Ongoing</option>
                                    <option value="completed" {% if event.status == 'completed' %}selected{% endif %}>Completed</option>
                                    <option value="cancelled" {% if event.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Location *</label>
                            <input type="text" name="location" class="form-control" required value="{{ event.location }}">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Start Date & Time *</label>
                                <input type="datetime-local" name="start_time" class="form-control" required
                                       value="{{ event.start_time.strftime('%Y-%m-%dT%H:%M') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">End Date & Time *</label>
                                <input type="datetime-local" name="end_time" class="form-control" required
                                       value="{{ event.end_time.strftime('%Y-%m-%dT%H:%M') }}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Event Image</label>
                            <input type="file" name="image_file" class="form-control mb-2"
                                   accept=".png,.jpg,.jpeg,.gif,.webp">
                            <label class="form-label small text-muted">Or use an image URL</label>
                            <input type="url" name="image_url" class="form-control" value="{{ event.image_url or '' }}">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg"></i> Save Changes
                            </button>
                            <a href="{{ url_for('event_detail', event_id=event.id) }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
