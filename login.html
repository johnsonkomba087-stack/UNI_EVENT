{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right text-primary display-5"></i>
                        <h3 class="fw-bold mt-2">Welcome Back</h3>
                        <p class="text-muted small">Sign in to your UniEvents account</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required autofocus
                                   placeholder="Enter username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required
                                   placeholder="Enter password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                    </form>

                    <p class="text-center mt-4 mb-0 small">
                        Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
                    </p>

                    <hr class="my-4">
                    <div class="small text-muted">
                        <strong>Demo accounts:</strong><br>
                        Admin: <code>admin</code> / <code>admin123</code><br>
                        Organizer: <code>organizer1</code> / <code>org123</code><br>
                        Student: <code>student1</code> / <code>student123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
